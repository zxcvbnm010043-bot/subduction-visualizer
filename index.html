<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板塊隱沒帶構造生成動態模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .anim-step { opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
        .anim-step.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        @keyframes flow {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }
        .flow-line { stroke-dasharray: 8, 8; animation: flow 1.5s linear infinite; }
        @keyframes pulse-magma {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.8)); }
        }
        .magma-active { animation: pulse-magma 2s infinite ease-in-out; }
        .svg-element { transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 animate-ping"></div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-500 bg-clip-text text-transparent">
                    Subduction Zone Step-by-Step Animation
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="step-indicator" class="text-xs font-mono bg-cyan-500/10 text-cyan-400 px-3 py-1.5 rounded-full border border-cyan-500/20">
                    階段 0 / 5
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-8">
        
        <!-- 標題與說明 -->
        <div class="text-center max-w-2xl mx-auto space-y-3">
            <h2 id="main-title" class="text-3xl font-extrabold tracking-tight text-slate-100">板塊隱沒帶動態生成過程</h2>
            <p id="main-subtitle" class="text-slate-400 text-sm md:text-base">點擊下方播放或切換步驟，觀察隱沒系統中各個構造單元的時序演化。</p>
        </div>

        <!-- 動態 SVG 視窗 -->
        <section class="glass-panel rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <div class="w-full overflow-x-auto">
                <svg id="tectonic-svg" viewBox="0 0 1000 450" class="w-full min-w-[750px] h-auto select-none">
                    <!-- 背景地函 -->
                    <rect width="1000" height="450" fill="#070a14" rx="12"/>
                    <path d="M0,150 Q500,160 1000,150 L1000,450 L0,450 Z" fill="#111827" fill-opacity="0.9"/>

                    <!-- 水體層 -->
                    <path d="M0,80 Q250,90 500,80 Q750,70 1000,80 L1000,120 L0,120 Z" fill="#0ea5e9" fill-opacity="0.15" class="svg-element"/>

                    <!-- 1. 下插海洋板塊 (Subducting Slab) -->
                    <g id="slab-group" class="svg-element" transform="translate(0,0)">
                        <g transform="rotate(35 300 150)">
                            <rect x="-100" y="100" width="850" height="45" fill="#334155" rx="4"/>
                            <rect x="-100" y="145" width="850" height="140" fill="#1e293b" rx="4"/>
                        </g>
                    </g>

                    <!-- 上盤板塊 (Overriding Plate) -->
                    <path id="overriding-plate" class="svg-element" d="M 420,120 Q 600,120 1000,120 L 1000,450 L 370,450 Z" fill="#1e293b" fill-opacity="0.85"/>

                    <!-- 構造單元標記與圖形 (依步驟顯示) -->
                    
                    <!-- 階段 1: 海溝 (Trench) -->
                    <g id="unit-trench" class="svg-element opacity-0">
                        <polygon points="330,120 370,120 350,180" fill="#38bdf8" fill-opacity="0.7"/>
                        <line x1="350" y1="180" x2="350" y2="70" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
                        <text x="310" y="60" fill="#38bdf8" font-size="13" font-weight="bold">1. 海溝 / 海槽 (Trench)</text>
                    </g>

                    <!-- 階段 2: 增生楔 (Accretionary Wedge) -->
                    <g id="unit-wedge" class="svg-element opacity-0">
                        <path d="M 370,120 Q 420,130 460,150 L 350,180 Z" fill="#f59e0b" fill-opacity="0.8"/>
                        <!-- 疊瓦狀逆衝斷層線 -->
                        <path d="M 380,165 L 410,135 M 405,170 L 435,140" stroke="#b45309" stroke-width="2"/>
                        <text x="390" y="95" fill="#f59e0b" font-size="13" font-weight="bold">2. 增生楔 (Accretionary Wedge)</text>
                    </g>

                    <!-- 階段 3: 弧前盆地 (Fore-arc Basin) -->
                    <g id="unit-forearc" class="svg-element opacity-0">
                        <path d="M 460,150 Q 520,130 580,150 L 460,180 Z" fill="#10b981" fill-opacity="0.8"/>
                        <text x="470" y="105" fill="#10b981" font-size="13" font-weight="bold">3. 弧前盆地 (Fore-arc Basin)</text>
                    </g>

                    <!-- 階段 4: 火山島弧 (Volcanic Island Arc) -->
                    <g id="unit-arc" class="svg-element opacity-0">
                        <!-- 水化熔融箭頭 -->
                        <path d="M 380,260 Q 500,240 640,160" stroke="#f97316" stroke-width="3" fill="none" class="flow-line"/>
                        <polygon points="620,120 650,65 680,120" fill="#ef4444"/>
                        <circle cx="650" cy="80" r="16" fill="#f97316" class="magma-active"/>
                        <text x="590" y="45" fill="#ef4444" font-size="13" font-weight="bold">4. 火山島弧 (Volcanic Arc)</text>
                        <!-- 100km 深度標示 -->
                        <line x1="150" y1="285" x2="850" y2="285" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1"/>
                        <text x="700" y="278" fill="#64748b" font-size="11">脫水熔融深度 (~100km)</text>
                    </g>

                    <!-- 階段 5: 弧後盆地 (Back-arc Basin) -->
                    <g id="unit-backarc" class="svg-element opacity-0">
                        <rect x="740" y="112" width="180" height="28" fill="#8b5cf6" fill-opacity="0.8" rx="4"/>
                        <text x="740" y="95" fill="#c084fc" font-size="13" font-weight="bold">5. 弧後盆地 / 張裂 (Back-arc Basin)</text>
                        <path d="M 780,126 L 755,126 M 755,126 L 760,121 M 755,126 L 760,131" stroke="#fff" stroke-width="2"/>
                        <path d="M 880,126 L 905,126 M 905,126 L 900,121 M 905,126 L 900,131" stroke="#fff" stroke-width="2"/>
                    </g>
                </svg>
            </div>
        </section>

        <!-- 控制面板與說明文字 -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-stretch">
            <!-- 左側：步驟控制面板 -->
            <div class="glass-panel rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div>
                    <h3 class="text-base font-bold text-slate-200 mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        動畫控制中心
                    </h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="prevStep()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-sm transition border border-slate-700">上一階段</button>
                        <button onclick="nextStep()" class="px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition">下一階段</button>
                    </div>
                    <button id="play-btn" onclick="togglePlay()" class="w-full mt-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 font-medium text-sm transition border border-cyan-500/30 flex items-center justify-center gap-2">
                        <span id="play-icon">&#9658;</span> <span id="play-text">自動播放動畫</span>
                    </button>
                </div>

                <div class="space-y-1.5 pt-4 border-t border-slate-800">
                    <div onclick="goToStep(0)" class="step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400" id="tab-0"><span>0. 初始狀態：板塊靠近</span></div>
                    <div onclick="goToStep(1)" class="step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400" id="tab-1"><span>1. 海溝 / 海槽形塑</span></div>
                    <div onclick="goToStep(2)" class="step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400" id="tab-2"><span>2. 增生楔累積</span></div>
                    <div onclick="goToStep(3)" class="step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400" id="tab-3"><span>3. 弧前盆地沉積</span></div>
                    <div onclick="goToStep(4)" class="step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400" id="tab-4"><span>4. 火山島弧噴發</span></div>
                    <div onclick="goToStep(5)" class="step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400" id="tab-5"><span>5. 弧後盆地張裂</span></div>
                </div>
            </div>

            <!-- 右側：當前步驟詳解卡片 -->
            <div class="lg:col-span-2 glass-panel rounded-2xl p-8 flex flex-col justify-between">
                <div id="step-desc-container" class="space-y-4">
                    <!-- 動態載入文字 -->
                </div>
                <div class="text-xs text-slate-500 pt-4 border-t border-slate-800 flex justify-between items-center">
                    <span>板塊構造演化模型</span>
                    <span class="text-cyan-400 font-mono">Status: Interactive Simulation</span>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Subduction Zone Animated Tectonic Visualizer &bull; Built for Geoscience Education</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        let currentStep = 0;
        const totalSteps = 5;
        let isPlaying = false;
        let playInterval = null;

        const stepsData = [
            {
                title: "0. 初始狀態：洋殼與上盤板塊對接",
                badge: "Initial State",
                color: "text-slate-300",
                desc: "在大洋板塊與大陸或島弧上盤板塊交界處，密度較大的海洋板塊準備向下隱沒進入地函。此時地表尚未形成完整的隱沒帶構造序列。"
            },
            {
                title: "1. 海溝 / 海槽 (Trench / Trough)",
                badge: "Trench Formation",
                color: "text-cyan-400",
                desc: "當海洋板塊向下彎曲、俯衝進入地函時，在地表拉扯並向下凹陷，形成狹長、深邃的**海溝**。若沉積物較多或處於斜向碰撞，則可能形成**海槽**。"
            },
            {
                title: "2. 增生楔 (Accretionary Wedge)",
                badge: "Accretionary Wedge",
                desc: "海洋板塊向下滑動時，其表面攜帶的深海沉積物與洋殼碎屑被上盤板塊前緣像「推雪機」一樣刮除並剝落，擠壓形成向陸側傾斜的疊瓦狀逆衝斷層與褶皺。"
            },
            {
                title: "3. 弧前盆地 (Fore-arc Basin)",
                badge: "Fore-arc Basin",
                desc: "位於增生楔與火山島弧之間。增生楔的隆起阻擋了外海沉積物，與火山弧風化剝蝕的碎屑共同在夾陷空間中堆積厚重的海相地層，形成低熱流的弧前盆地。"
            },
            {
                title: "4. 火山島弧 / 島弧 (Volcanic Island Arc)",
                badge: "Volcanic Arc & Flux Melting",
                desc: "下插板塊下沉至約 100 公里深處時脫水，水份溢出並滲入上盤的地函楔引發**水化熔融 (Flux Melting)**。熔岩上升噴發，在距離海溝一定距離處形成火山鏈。"
            },
            {
                title: "5. 弧後盆地 (Back-arc Basin)",
                badge: "Back-arc Basin & Spreading",
                desc: "在火山島弧內陸側，受**板塊後撤 (Slab Rollback)** 與地函上湧流拉扯，上盤板塊發生張裂與海床擴張，形成弧後盆地（如沖繩海槽、馬里亞納海槽）。"
            }
        ];

        function goToStep(step) {
            currentStep = step;
            updateVisualization();
        }

        function nextStep() {
            currentStep = (currentStep + 1) % (totalSteps + 1);
            updateVisualization();
        }

        function prevStep() {
            currentStep = (currentStep - 1 + (totalSteps + 1)) % (totalSteps + 1);
            updateVisualization();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btnText = document.getElementById('play-text');
            const playIcon = document.getElementById('play-icon');
            
            if (isPlaying) {
                btnText.textContent = "暫停動畫";
                playIcon.innerHTML = "&#10074;&#10074;";
                playInterval = setInterval(() => {
                    if (currentStep < totalSteps) {
                        nextStep();
                    } else {
                        currentStep = 0;
                        updateVisualization();
                    }
                }, 3500);
            } else {
                btnText.textContent = "自動播放動畫";
                playIcon.innerHTML = "&#9658;";
                clearInterval(playInterval);
            }
        }

        function updateVisualization() {
            // 更新進度標籤
            document.getElementById('step-indicator').textContent = `階段 ${currentStep} / ${totalSteps}`;

            // 控制 SVG 元素顯示
            document.getElementById('unit-trench').classList.toggle('opacity-100', currentStep >= 1);
            document.getElementById('unit-wedge').classList.toggle('opacity-100', currentStep >= 2);
            document.getElementById('unit-forearc').classList.toggle('opacity-100', currentStep >= 3);
            document.getElementById('unit-arc').classList.toggle('opacity-100', currentStep >= 4);
            document.getElementById('unit-backarc').classList.toggle('opacity-100', currentStep >= 5);

            // 隨步驟進度調整下插板塊位置或傾斜動態感
            const slabGroup = document.getElementById('slab-group');
            if (currentStep >= 1) {
                slabGroup.style.transform = "translate(0, 0)";
            } else {
                slabGroup.style.transform = "translate(-20px, -10px)";
            }

            // 更新左側分頁高亮
            for (let i = 0; i <= totalSteps; i++) {
                const tab = document.getElementById(`tab-${i}`);
                if (i === currentStep) {
                    tab.className = "step-tab cursor-pointer text-xs p-2 rounded-lg transition bg-cyan-500/10 border border-cyan-500/40 text-cyan-300 font-semibold flex items-center justify-between";
                } else {
                    tab.className = "step-tab cursor-pointer text-xs p-2 rounded-lg transition hover:bg-slate-800/80 flex items-center justify-between text-slate-400";
                }
            }

            // 更新右側詳解文字
            const data = stepsData[currentStep];
            const container = document.getElementById('step-desc-container');
            container.innerHTML = `
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-2xl font-bold ${data.color}">${data.title}</h3>
                        <span class="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">${data.badge}</span>
                    </div>
                    <p class="text-slate-300 text-base leading-relaxed mt-4">${data.desc}</p>
                </div>
            `;
        }

        // 初始化
        updateVisualization();
    </script>
</body>
</html>
